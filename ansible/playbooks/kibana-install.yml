
---
- name: Установить Kibana для Production SRE Lab
  hosts: logging
  become: true
  gather_facts: true

  tasks:
    - name: Установить Kibana 9.5.6
      ansible.builtin.apt:
        name: "kibana=9.5.6"
        state: present
        update_cache: true
        cache_valid_time: 3600
      notify: Перезапустить Kibana

    - name: Ограничить доступ к Kibana localhost
      ansible.builtin.lineinfile:
        path: /etc/kibana/kibana.yml
        regexp: '^\s*#?\s*server\.host:'
        line: 'server.host: "127.0.0.1"'
        backup: true
      notify: Перезапустить Kibana

    - name: Применить изменения Kibana
      ansible.builtin.meta: flush_handlers

    - name: Включить автозапуск Kibana
      ansible.builtin.systemd_service:
        name: kibana
        enabled: true
        state: started
        daemon_reload: true

    - name: Дождаться запуска порта Kibana
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5601
        timeout: 180

    - name: Вывести результат
      ansible.builtin.debug:
        msg: "Kibana установлена и слушает localhost:5601"

  handlers:
    - name: Перезапустить Kibana
      ansible.builtin.systemd_service:
        name: kibana
        state: restarted
        daemon_reload: true
