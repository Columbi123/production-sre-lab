
[control]
sre-control ansible_connection=local

[control:vars]
ansible_python_interpreter=/usr/bin/python3

[app]
sre-app-01 ansible_host=10.10.20.10

[app:vars]
ansible_user=sre
ansible_ssh_private_key_file=/home/sre/.ssh/id_ed25519_sre_app
ansible_python_interpreter=/usr/bin/python3

[logging]
sre-logging-01 ansible_host=10.10.20.20

[logging:vars]
ansible_user=sre
ansible_ssh_private_key_file=/home/sre/.ssh/id_ed25519_sre_logging
ansible_python_interpreter=/usr/bin/python3

[terminal:children]
control
app
logging
