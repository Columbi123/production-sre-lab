name: Production SRE Lab CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Syntax and Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: app/fastapi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/fastapi/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install \
            -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m py_compile main.py

      - name: Run pytest
        run: |
          python -m pytest -v

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build FastAPI Docker image
        run: |
          docker build \
            -t sre-api:ci \
            ./app/fastapi
