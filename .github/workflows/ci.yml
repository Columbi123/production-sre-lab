name: Production SRE Lab CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  python-tests:
    name: Python Syntax and Pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: app/fastapi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/fastapi/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m py_compile main.py

      - name: Run unit and API tests
        run: |
          python -m pytest -m "not integration" -v


  postgres-integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: sretest
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: sre_ci

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U sretest -d sre_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      POSTGRES_USER: sretest
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_DB: sre_ci

    defaults:
      run:
        working-directory: app/fastapi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/fastapi/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Run PostgreSQL integration tests
        run: |
          python -m pytest -m integration -v


  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-24.04
    needs:
      - python-tests
      - postgres-integration
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build FastAPI Docker image
        run: |
          docker build \
            -t sre-api:ci \
            ./app/fastapi

  publish-ghcr:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    needs:
      - python-tests
      - postgres-integration
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./app/fastapi
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify published image
        run: |
          docker buildx imagetools inspect \
            "${{ steps.meta.outputs.tags }}"

