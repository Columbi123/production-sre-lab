
name: Self-hosted Runner Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  runner-test:
    name: Verify SRE Control Runner
    runs-on: [self-hosted, Linux, X64, sre-lab-cd]
    timeout-minutes: 5

    steps:
      - name: Verify hostname and user
        run: |
          echo "Checking runner environment"
          hostname
          whoami
          id
          uname -m

          test "$(hostname)" = "sre-control"
          test "$(whoami)" = "gha-runner"

      - name: Verify runner permissions
        run: |
          if id -nG | grep -Eq '(^| )(sudo|docker)( |$)'; then
            echo "ERROR: Runner has excessive privileges"
            exit 1
          fi

          echo "Runner privileges OK"

      - name: Verify GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Runner: $RUNNER_NAME"

          echo "Self-hosted Runner test successful!"

