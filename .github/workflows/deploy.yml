
name: Production SRE Lab CD

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Full 40-character commit SHA to deploy"
        required: true
        type: string
      dry_run:
        description: "Validate only (no deployment)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: sre-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy FastAPI to MWS Cloud
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, sre-lab-cd]
    timeout-minutes: 15

    steps:
      - name: Verify release SHA and successful CI
        shell: bash
        env:
          DEPLOY_SHA: ${{ inputs.image_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          sha = os.environ["DEPLOY_SHA"]

          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              sys.exit("Invalid SHA: expected 40 lowercase hex characters")

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def github_api(path):
              request = urllib.request.Request(
                  base + path, headers=headers
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          comparison = github_api(f"/compare/{sha}...main")

          if comparison["status"] not in ("ahead", "identical"):
              sys.exit("Rejected: commit is not an ancestor of main")

          runs = github_api(
              "/actions/workflows/ci.yml/runs"
              f"?head_sha={sha}&branch=main&event=push&per_page=100"
          )

          successful = any(
              run["head_sha"] == sha
              and run["conclusion"] == "success"
              for run in runs["workflow_runs"]
          )

          if not successful:
              sys.exit("Rejected: successful CI run not found")

          print(f"Verified release: {sha}")
          print("Commit belongs to main")
          print("CI completed successfully")
          PY

      - name: Show release information
        shell: bash
        env:
          DEPLOY_SHA: ${{ inputs.image_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "Environment: MWS Cloud"
          echo "Target: sre-app-01"
          echo "Release SHA: $DEPLOY_SHA"
          echo "Dry run: $DRY_RUN"
          echo "Release validation completed"

      - name: Deploy application through SSH
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          DEPLOY_SHA: ${{ inputs.image_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SSH_KEY="/home/gha-runner/.ssh/id_ed25519_sre_deploy"

          test -r "$SSH_KEY"

          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -T \
            -i "$SSH_KEY" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            gha-deploy@10.10.20.10 \
            "sudo -n /usr/local/sbin/sre-deploy '$DEPLOY_SHA'"

          echo "CD deployment finished successfully"
