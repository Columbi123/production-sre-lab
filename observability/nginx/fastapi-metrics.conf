server {
    listen 10.10.20.10:9101;
    server_name _;

    access_log off;

    location = /metrics {
        allow 10.10.10.10;
        deny all;

        proxy_pass http://127.0.0.1:8000/metrics;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
