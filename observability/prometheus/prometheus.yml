global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "127.0.0.1:9090"

  - job_name: "fastapi"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - "10.10.20.10:9101"
        labels:
          service: "sre-lab-api"

  - job_name: "node-control"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - "127.0.0.1:9100"
        labels:
          server: "sre-control"

  - job_name: "node-app"
    metrics_path: /node-metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - "10.10.20.10:9101"
        labels:
          server: "sre-app-01"

  - job_name: "cadvisor"
    metrics_path: /cadvisor-metrics
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets:
          - "10.10.20.10:9101"
        labels:
          server: "sre-app-01"


  # Мониторинг базы данных PostgreSQL
  - job_name: "postgresql"
    metrics_path: /postgres-metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "10.10.20.10:9101"
        labels:
          server: "sre-app-01"

  # HTTP-мониторинг доступности FastAPI
  - job_name: "blackbox-fastapi"
    scrape_interval: 15s
    metrics_path: /probe

    params:
      module: [http_ready]

    static_configs:
      - targets:
          - http://10.10.20.10:9101/ready
        labels:
          service: "sre-lab-api"
          server: "sre-app-01"

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: 127.0.0.1:9115
