services:
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: sre-lab-cadvisor
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
